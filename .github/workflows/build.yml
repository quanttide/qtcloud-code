name: build

on:
  push:
    branches: [main]
    paths:
      - 'src/cli/**'
  pull_request:
    paths:
      - 'src/cli/**'
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#cli/}" >> $GITHUB_OUTPUT
      - name: validate changelog
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          grep -q "## [$VERSION]" CHANGELOG.md || { echo "CHANGELOG.md missing entry for $VERSION"; exit 1; }

  test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: build
        run: cargo build
      - name: test
        run: cargo test

  build-binaries:
    if: startsWith(github.ref, 'refs/tags/cli/')
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: qtcloud-code-${{ matrix.target }}
          path: ${{ github.workspace }}/src/cli/target/${{ matrix.target }}/release/qtcloud-code${{ matrix.ext }}
